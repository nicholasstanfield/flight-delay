[project]
name = "flight-delay"
version = "0.1.0"
description = "Flight delay prediction app"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "joblib",
    "pandas>=2.2,<3",
    "plotly>=7.0.0",
    "pydeck",
    "requests",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
    "xgboost>=3.4.0",
]

[dependency-groups]
dev = [
    "hyperopt>=0.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "mlflow>=3",
    "seaborn>=0.13.2",
    "timezonefinder>=8.3.0",
]

[tool.uv]
default-groups = []
